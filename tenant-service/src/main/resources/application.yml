spring:
  application:
    name: tenant-service

  datasource:
    url: jdbc:postgresql://localhost:5432/tenant_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      # Pool optimal: (core_count * 2) + effective_spindle_count
      # Pour dev: 4-10 connexions suffisent
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # NEVER use 'create' or 'update' in production
      # ALWAYS use Flyway for schema management
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # IMPORTANT: Active Hibernate Envers pour audit automatique
        envers:
          audit_table_suffix: _audit
          revision_field_name: revision_id
          revision_type_field_name: revision_type
        # Performance
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        # Logging SQL (dev only)
        show_sql: false
        format_sql: true
        use_sql_comments: true
    # CRITICAL: Active JPA Auditing pour @CreatedDate, @LastModifiedDate
    open-in-view: false

  # Redis Cache Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  cache:
    type: redis
    redis:
      # TTL par défaut
      time-to-live: 300000 # 5 minutes
      cache-null-values: false

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Transactional Outbox Pattern
      transaction-id-prefix: tenant-service-tx
      properties:
        enable.idempotence: true
        acks: all
        compression.type: lz4

  # Flyway Migration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 8081
  # Graceful shutdown pour finir traitement requêtes en cours
  shutdown: graceful

# Management endpoints (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    com.shopstream: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.kafka: INFO

# Custom properties
tenant:
  cache:
    # Cache la première page de résultats
    ttl-minutes: 5
  scheduler:
    # Hard delete des tenants après 30 jours (RGPD)
    cleanup-cron: "0 0 2 * * *" # 2h du matin
